name: E2E tests

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright (WP ${{ matrix.wp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The admin app bundles @wordpress/dataviews, which must work with the
        # @wordpress/components that each supported WordPress version ships.
        wp: [ '6.9', 'latest' ]
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - uses: ramsey/composer-install@v4
        with:
          composer-options: --no-dev

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npx playwright install chromium --with-deps

      - name: Configure test environment
        run: |
          if [ "${{ matrix.wp }}" = "latest" ]; then CORE=null; else CORE="\"WordPress/WordPress#${{ matrix.wp }}\""; fi
          echo "{ \"core\": ${CORE} }" > .wp-env.test.override.json
          cat .wp-env.test.override.json

      - run: npm run wp-env:test start

      - run: npm run test:e2e
        env:
          # Chromium (the only browser we test) is installed above with its system deps;
          # stop wp-scripts from downloading every other browser.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-artifacts-wp-${{ matrix.wp }}
          path: artifacts/
          retention-days: 7
